<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KBK Academy | Student Access Test</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 760px;
      margin: 30px auto;
      padding: 20px;
      background: #f5f7fb;
      color: #172033;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 14px;
      margin-bottom: 18px;
      box-shadow: 0 3px 12px #0000000d;
    }

    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 8px;
      font-size: 15px;
    }

    input {
      border: 1px solid #ccd2dc;
    }

    button {
      border: 0;
      background: #164e9b;
      color: white;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    #status {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    video {
      width: 100%;
      margin-top: 12px;
      background: black;
      border-radius: 8px;
    }

    .muted {
      color: #64748b;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <h1>KBK Academy</h1>
  <p>Student recording access test</p>

  <div class="card" id="loginCard">
    <h2>Student Login</h2>

    <form id="loginForm">
      <label>Email</label>
      <input
        id="email"
        type="email"
        value="sabithamurugesan2004@gmail.com"
        required
        autocomplete="username"
      >

      <label>Password</label>
      <input
        id="password"
        type="password"
        required
        autocomplete="current-password"
      >

      <button type="submit" id="loginButton">Sign in</button>
    </form>

    <p class="muted">
      Use your test student account. This page does not send
      your password to anyone other than Supabase Auth.
    </p>
  </div>

  <div class="card">
    <h2>Assigned Lessons</h2>
    <button id="loadButton" disabled>Load My Lessons</button>
    <div id="lessons"></div>
  </div>

  <div class="card">
    <h2>Recording Player</h2>
    <p id="status">Please sign in first.</p>
    <video id="player" controls playsinline></video>
  </div>

  <script type="module">
    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL =
      "https://ndcbtoelfkgdnfswliyy.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_Z_Omh_DwmcwWy1rKEaLCUg_nKtXB1uN";

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const status = document.getElementById("status");
    const lessonsDiv = document.getElementById("lessons");
    const loadButton = document.getElementById("loadButton");
    const player = document.getElementById("player");

    let currentUser = null;

    function showStatus(message) {
      status.textContent = message;
    }

    document.getElementById("loginForm")
      .addEventListener("submit", async (event) => {
        event.preventDefault();

        const button = document.getElementById("loginButton");
        button.disabled = true;
        showStatus("Signing in...");

        try {
          const { data, error } = await supabase.auth.signInWithPassword({
            email: document.getElementById("email").value.trim(),
            password: document.getElementById("password").value
          });

          if (error) throw error;

          currentUser = data.user;

          document.getElementById("loginCard").style.display = "none";
          loadButton.disabled = false;

          showStatus("Signed in. Loading assigned lessons...");
          await loadLessons();

        } catch (error) {
          showStatus("Login failed: " + error.message);
        } finally {
          button.disabled = false;
        }
      });

    async function loadLessons() {
      lessonsDiv.replaceChildren();
      player.removeAttribute("src");
      player.load();

      // Fetch assignments visible to this authenticated student.
      const { data: assignments, error } = await supabase
        .from("lesson_assignments")
        .select("lesson_id, batch_id, student_id")
        .or(`student_id.eq.${currentUser.id},batch_id.not.is.null`);

      if (error) {
        showStatus("Could not load assignments: " + error.message);
        return;
      }

      // Confirm batch memberships through RLS.
      const { data: memberships, error: membershipError } = await supabase
        .from("batch_members")
        .select("batch_id")
        .eq("student_id", currentUser.id);

      if (membershipError) {
        showStatus("Could not load memberships: " + membershipError.message);
        return;
      }

      const myBatchIds = new Set((memberships || []).map(m => m.batch_id));

      const lessonIds = [...new Set(
        (assignments || [])
          .filter(a =>
            a.student_id === currentUser.id ||
            (a.batch_id && myBatchIds.has(a.batch_id))
          )
          .map(a => a.lesson_id)
      )];

      if (!lessonIds.length) {
        showStatus("No assigned lessons found.");
        return;
      }

      const { data: lessons, error: lessonError } = await supabase
        .from("lessons")
        .select("id, title, description, subject, topic, storage_path")
        .in("id", lessonIds);

      if (lessonError) {
        showStatus("Could not load lessons: " + lessonError.message);
        return;
      }

      showStatus(`Found ${lessons.length} assigned lesson(s).`);

      for (const lesson of lessons) {
        const card = document.createElement("div");
        card.className = "card";

        const title = document.createElement("h3");
        title.textContent = lesson.title;

        const detail = document.createElement("p");
        detail.textContent =
          [lesson.subject, lesson.topic].filter(Boolean).join(" · ");

        const button = document.createElement("button");
        button.textContent = "Watch Recording";

        button.addEventListener("click", async () => {
          if (!lesson.storage_path) {
            showStatus("No recording is linked to this lesson.");
            return;
          }

          showStatus("Requesting access to recording...");

          // Requests a temporary URL through the authenticated client.
          const { data, error } = await supabase.storage
            .from("kbk-recordings")
            .createSignedUrl(lesson.storage_path, 300);

          if (error) {
            showStatus("Recording access denied or failed: " + error.message);
            return;
          }

          player.src = data.signedUrl;
          player.load();

          showStatus("Temporary recording URL created. Press Play.");
          player.scrollIntoView({ behavior: "smooth", block: "center" });
        });

        card.append(title, detail, button);
        lessonsDiv.appendChild(card);
      }
    }

    loadButton.addEventListener("click", loadLessons);

    // Do not persist this test page's session across browser restarts.
    window.addEventListener("pagehide", () => {
      supabase.auth.signOut({ scope: "local" });
    });
  </script>
</body>
</html>
