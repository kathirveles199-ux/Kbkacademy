<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mentor Dashboard | KBK Academy</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7f1;color:#10251d;font-family:Inter,system-ui,Arial,sans-serif}a{color:inherit;text-decoration:none}.shell{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}.visual{padding:clamp(28px,6vw,76px);background:radial-gradient(circle at 80% 15%,#c6e83b66,transparent 28%),#073d2b;color:white;display:flex;flex-direction:column;justify-content:space-between}.brand{font-weight:900;letter-spacing:.04em}.brand span{color:#c6e83b}.visual h1{font-size:clamp(38px,5vw,66px);line-height:1.02;letter-spacing:-.04em;max-width:560px}.visual p{color:#c8d9cf;line-height:1.8;max-width:470px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chips span{border:1px solid #ffffff35;border-radius:99px;padding:8px 12px;font-size:12px}.main{display:grid;place-items:center;padding:28px}.card{width:min(440px,100%);background:white;padding:clamp(24px,4vw,40px);border:1px solid #e0e8df;border-radius:24px;box-shadow:0 24px 70px #163b2610}.eyebrow{font-size:11px;font-weight:900;letter-spacing:.16em;color:#0b7a48}.card h2{font-size:32px;letter-spacing:-.04em;margin:10px 0}.muted{color:#6b7b72;font-size:14px;line-height:1.6}.field{margin:18px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:8px}.field input{width:100%;padding:14px;border:1px solid #d5dfd6;border-radius:11px;font:inherit}.btn{width:100%;border:0;border-radius:11px;padding:14px;background:#0b7a48;color:white;font-weight:900;font-size:14px;cursor:pointer}.btn:disabled{opacity:.6}.status{font-size:13px;line-height:1.5;margin-top:14px;overflow-wrap:anywhere}.back{display:inline-block;margin-top:20px;color:#0b7a48;font-weight:800;font-size:13px}@media(max-width:780px){.shell{grid-template-columns:1fr}.visual{padding:25px;min-height:270px}.visual h1{font-size:38px;margin:35px 0 10px}.main{padding:18px;align-items:start}.card{margin:10px 0 30px}}.app{max-width:1100px;margin:auto;padding:24px 16px 60px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.top h1{margin:0;font-size:26px}.btn-small{border:0;border-radius:10px;padding:10px 14px;background:#073d2b;color:white;font-weight:800;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:24px}.tile,.lesson{background:white;border:1px solid #e0e8df;border-radius:17px;padding:20px}.tile strong{font-size:25px;display:block}.muted2{color:#6b7b72;font-size:13px;line-height:1.6}.lesson{margin-top:12px}.lesson h3{margin:0 0 8px}.lesson button{margin-top:10px}.statusbox{background:#eaf6e9;border-radius:12px;padding:13px;color:#27583b;font-size:13px;overflow-wrap:anywhere}.hidden{display:none}video{width:100%;max-height:460px;background:#07130e;border-radius:12px;margin-top:12px}</head><body><main class="app"><header class="top"><div><div class="eyebrow">KBK TEACHING PORTAL</div><h1 id="welcome">Mentor dashboard</h1><p class="muted2">Review your batches, lessons and recording workflow.</p></div><button class="btn-small" id="logout">Sign out</button></header><div class="grid"><div class="tile"><span class="muted2">Your batches</span><strong id="batchCount">—</strong></div><div class="tile"><span class="muted2">Your lessons</span><strong id="lessonCount">—</strong></div><div class="tile"><span class="muted2">Role</span><strong style="font-size:19px">Verified mentor</strong></div></div><h2 style="margin-top:30px">My batches</h2><div id="status" class="statusbox">Checking your session…</div><div id="batches"></div><h2 style="margin-top:30px">My lessons</h2><div id="lessons"></div><div class="tile" style="margin-top:20px"><h3>Recording upload workflow</h3><p class="muted2">For now, upload recordings into the private <code>kbk-recordings</code> bucket under a folder named with your own mentor user ID. Then set the lesson's <code>storage_path</code> to the exact object path and create a lesson assignment for the appropriate batch or student. Storage RLS should remain enabled. This initial portal is read-only for batch and lesson records; we will add schema-matched creation/upload forms after validating the database column requirements.</p></div></main><script type="module">const SUPABASE_URL = "https://ndcbtoelfkgdnfswliyy.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_Z_Omh_DwmcwWy1rKEaLCUg_nKtXB1uN";
const { createClient } = await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm");
const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

const $=id=>document.getElementById(id);function say(t){$('status').textContent=t}$('logout').onclick=async()=>{await supabase.auth.signOut();location.replace('login.html')};function el(tag,cls,txt){const x=document.createElement(tag);if(cls)x.className=cls;if(txt!==undefined)x.textContent=txt;return x}
async function start(){const {data:{session}}=await supabase.auth.getSession();if(!session){location.replace('login.html');return}const user=session.user;const {data:p,error:pe}=await supabase.from('profiles').select('role,full_name').eq('id',user.id).maybeSingle();if(pe)throw pe;if(!p||String(p.role).toLowerCase()!=='mentor'){location.replace('login.html');return}$('welcome').textContent='Vanakkam, '+(p.full_name||user.email?.split('@')[0]||'Mentor');const {data:batches,error:be}=await supabase.from('batches').select('id,name,course_id,created_at').eq('mentor_id',user.id);if(be)throw be;$('batchCount').textContent=(batches||[]).length;for(const b of batches||[]){const card=el('article','lesson');card.append(el('h3','',b.name||'Untitled batch'),el('p','muted2','Batch ID: '+b.id));$('batches').append(card)}const {data:lessons,error:le}=await supabase.from('lessons').select('id,title,description,subject,topic,batch_id,storage_path').eq('mentor_id',user.id);if(le){say('Batch list loaded. Lesson list could not be read with the current table policies: '+le.message);return}$('lessonCount').textContent=(lessons||[]).length;for(const l of lessons||[]){const card=el('article','lesson');card.append(el('h3','',l.title||'Lesson'),el('p','muted2',[l.subject,l.topic,l.description].filter(Boolean).join(' · ')||'No description'),el('p','muted2','Recording: '+(l.storage_path?'linked':'not linked')));$('lessons').append(card)}say('Mentor access verified. '+(batches||[]).length+' batch(es) and '+(lessons||[]).length+' lesson(s) loaded where permitted.')}
try{await start()}catch(e){say('Could not load mentor dashboard: '+(e.message||'Please try again.'))}
</script></body></html>
