<html lang="en">
<head>

<title>KBK Academy — Student Onboarding</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f5f7fb;
 color:#172033;
}

.container{
 max-width:1050px;
 margin:auto;
 padding:25px;
}

.header{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin-bottom:20px;
}

.logo{
 font-size:22px;
 font-weight:800;
 color:#10243e;
}

.logo small{
 display:block;
 color:#64748b;
 font-size:12px;
 margin-top:4px;
}

.progress{
 height:8px;
 background:#e2e8f0;
 border-radius:20px;
 overflow:hidden;
 margin-bottom:28px;
}

.progress-bar{
 height:100%;
 background:#2563eb;
 width:25%;
 transition:.3s;
}

.card{
 background:white;
 border:1px solid #e1e6ee;
 border-radius:16px;
 padding:26px;
 box-shadow:0 8px 25px rgba(15,23,42,.06);
}

h1{
 margin:0 0 8px;
 font-size:28px;
}

h2{
 margin-top:0;
}

p{
 color:#64748b;
 line-height:1.55;
}

.grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:16px;
 margin-top:20px;
}

.field label{
 display:block;
 font-size:13px;
 font-weight:bold;
 margin-bottom:7px;
}
